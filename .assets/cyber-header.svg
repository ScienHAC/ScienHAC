<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyber_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070E"/>
      <stop offset="50%" stop-color="#0F0C1B"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <linearGradient id="neon_edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#A78BFA;#FF007A;#00FF66;#00F5FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#FF007A;#00FF66;#00F5FF;#A78BFA" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF007A">
        <animate attributeName="stop-color" values="#FF007A;#00FF66;#00F5FF;#A78BFA;#FF007A" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="text_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2D9F3"/>
      <stop offset="70%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle_glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber_grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#261E47" stroke-width="0.8" opacity="0.45"/>
      <circle cx="0" cy="0" r="1" fill="#7C6FE0" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(-20px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(240px); opacity: 0; }
    }
    @keyframes pulse_opacity {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    @keyframes float_particle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-30px) translateX(15px); opacity: 0.1; }
    }
    .fira-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .scan-bar { animation: scanline 4s linear infinite; }
    .pulse-glow { animation: pulse_opacity 2.5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect x="2" y="2" width="996" height="216" rx="14" fill="url(#cyber_bg)"/>
  <rect x="2" y="2" width="996" height="216" rx="14" fill="url(#cyber_grid)"/>

  <!-- Glowing Outer Neon Border -->
  <rect x="2" y="2" width="996" height="216" rx="14" fill="none" stroke="url(#neon_edge)" stroke-width="2.2" filter="url(#subtle_glow)"/>

  <!-- Cyber Hacker Corner Accents -->
  <!-- Top-Left -->
  <path d="M 8 28 L 8 8 L 28 8" fill="none" stroke="#00F5FF" stroke-width="3" stroke-linecap="round" filter="url(#subtle_glow)"/>
  <!-- Top-Right -->
  <path d="M 972 8 L 992 8 L 992 28" fill="none" stroke="#00F5FF" stroke-width="3" stroke-linecap="round" filter="url(#subtle_glow)"/>
  <!-- Bottom-Left -->
  <path d="M 8 192 L 8 212 L 28 212" fill="none" stroke="#FF007A" stroke-width="3" stroke-linecap="round" filter="url(#subtle_glow)"/>
  <!-- Bottom-Right -->
  <path d="M 972 212 L 992 212 L 992 192" fill="none" stroke="#FF007A" stroke-width="3" stroke-linecap="round" filter="url(#subtle_glow)"/>

  <!-- Moving Radar / Cyber Scan Line -->
  <line x1="10" y1="0" x2="990" y2="0" stroke="url(#neon_edge)" stroke-width="1.8" class="scan-bar" opacity="0.6" filter="url(#subtle_glow)"/>

  <!-- Matrix / Hacker Streams (Left Background) -->
  <g class="fira-mono" font-size="10" fill="#7C6FE0" opacity="0.35">
    <text x="35" y="45">01000001 01010100</text>
    <text x="35" y="65">01000101 01001100</text>
    <text x="35" y="85">01001001 01000101</text>
    <text x="35" y="105">01010010 00100000</text>
    <text x="35" y="125">0x7F4B9A [KERNEL]</text>
    <text x="35" y="145">AST_MAP_LOADED</text>
    <text x="35" y="165">RUST_HARNESS_ON</text>
    <text x="35" y="185">OWASP_HARDENED</text>
  </g>

  <!-- Matrix / Hacker Streams (Right Background) -->
  <g class="fira-mono" font-size="10" fill="#7C6FE0" opacity="0.35" text-anchor="end">
    <text x="965" y="45">EEG_SEED_IV_87%</text>
    <text x="965" y="65">DONE_STATE_LOOP</text>
    <text x="965" y="85">SQLite_GRAPH_DB</text>
    <text x="965" y="105">NEXTJS16_CLOUDFLARE</text>
    <text x="965" y="125">200_CONCURRENT_USERS</text>
    <text x="965" y="145">SIH_NAT_FINALIST</text>
    <text x="965" y="165">372_LEETCODE_HARD</text>
    <text x="965" y="185">0x00_EXIT_STATUS</text>
  </g>

  <!-- Top Cyber Status HUD Bar -->
  <g class="fira-mono" font-size="11" font-weight="600">
    <rect x="340" y="14" width="320" height="22" rx="4" fill="#141126" stroke="#7C6FE0" stroke-width="1"/>
    <circle cx="355" cy="25" r="4" fill="#00FF66">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="368" y="29" fill="#00F5FF" letter-spacing="1.5">SYS_CORE: ONLINE</text>
    <text x="525" y="29" fill="#A78BFA">|</text>
    <text x="545" y="29" fill="#FF007A" letter-spacing="1.5">PROTO: ATELIER</text>
  </g>

  <!-- Main Animated Glitch/Glow Title -->
  <g text-anchor="middle">
    <!-- Glow Underlay -->
    <text x="500" y="115" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" font-size="44" font-weight="900" fill="#A78BFA" filter="url(#neon_glow)" letter-spacing="4" opacity="0.7">
      PIYUSH SHARMA
    </text>

    <!-- Foreground Sharp Gradient Text -->
    <text x="500" y="115" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" font-size="44" font-weight="900" fill="url(#text_grad)" letter-spacing="4">
      PIYUSH SHARMA
    </text>

    <!-- Handle Badge -->
    <rect x="420" y="130" width="160" height="24" rx="12" fill="#141126" stroke="#00F5FF" stroke-width="1.2" filter="url(#subtle_glow)"/>
    <text x="500" y="146" class="fira-mono" font-size="12" font-weight="700" fill="#00F5FF" letter-spacing="2">
      // ScienHAC //
    </text>

    <!-- Subtitle / Mission Tagline -->
    <text x="500" y="185" class="fira-mono" font-size="13" font-weight="600" fill="#C4B5FD" letter-spacing="2">
      AI FRAMEWORKS • RUST HARNESS • NEURAL BCI • OWASP SECURITY
    </text>

    <!-- Animated Cursor -->
    <rect x="800" y="174" width="8" height="14" fill="#00F5FF">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Floating Cyber Particles -->
  <circle cx="280" cy="90" r="1.5" fill="#00F5FF" opacity="0.8">
    <animate attributeName="cy" values="90;60;90" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="130" r="1.5" fill="#FF007A" opacity="0.8">
    <animate attributeName="cy" values="130;100;130" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="45" r="1.8" fill="#A78BFA" opacity="0.7">
    <animate attributeName="cx" values="480;520;480" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>